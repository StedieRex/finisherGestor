<div class="dashboard-container">
  
  <!-- Buscador Superior -->
  <div class="top-search-area">
    <div class="search-wrapper">
      <label>Buscar evento:</label>
      <input type="text" class="form-control search-input" placeholder="Input |">
    </div>
    <!-- Botón para crear el evento sin romper el diseño -->
    <button class="btn-create" (click)="crearNuevoEvento()">+ Crear Nuevo Evento</button>
  </div>

  <!-- Barra de Filtros Blanca -->
  <div class="filters-bar">
    <div class="filter-group">
      <label>Tipo del Evento</label>
      <select class="form-control">
        <option>Select Input</option>
        <option>Carrera</option>
        <option>Triatlón</option>
      </select>
    </div>
    
    <div class="filter-group">
      <label>Costo</label>
      <input type="text" class="form-control" placeholder="$0 - $99,999">
    </div>
    
    <div class="filter-group">
      <label>Rango de Fecha</label>
      <input type="text" class="form-control" placeholder="dd/mm/aaaa - dd/mm/aaaa">
    </div>
    
    <div class="filter-group">
      <label>Estado de Inscripción</label>
      <input type="text" class="form-control" placeholder="Inscripciones abiertas">
    </div>
  </div>

  <!-- Cuadrícula de Eventos -->
  <div class="events-grid">
    
    <div class="event-card" *ngFor="let evento of eventos" (click)="editarEvento(evento)">
      
      <!-- Imagen superior (Placeholder por ahora) -->
      <div class="card-image" style="background-image: url('https://placehold.co/600x300/333/666?text=FOTO+EVENTO');"></div>
      
      <div class="card-content">
        <!-- Placa Azul (Badge) -->
        <span class="badge-type">{{ evento.datosGenerales?.tipoEvento || 'Carrera' }}</span>
        
        <!-- Títulos en mayúsculas -->
        <h3 class="event-title">{{ evento.datosGenerales?.nombreEvento || 'CARRERA DE LOS DE CUERNAVACA' | uppercase }}</h3>
        <p class="event-subtitle">{{ evento.datosGenerales?.grupoOrganizador || 'CARRERA DE LOS DE CUERNAVACA' | uppercase }}</p>
      </div>
      
    </div>

  </div>
</div>
