<div class="layout-wrapper">
  
  <app-sidebar 
    [secciones]="secciones" 
    [seccionActiva]="seccionActiva"
    (seccionCambiada)="cambiarSeccion($event)">
  </app-sidebar>

  <main class="main-content">
    <header class="page-header">
      <h1>Nuevo Evento Deportivo</h1>
      <p>Completa todas las secciones para publicar tu evento. Los campos marcados con <span>*</span> son obligatorios.</p>
    </header>

    <form [formGroup]="eventoForm" (ngSubmit)="guardarEvento()" class="accordion-container">
      
      <!-- Iteramos sobre las secciones -->
      <div *ngFor="let seccion of secciones" 
           class="accordion-card"
           [class.active]="seccionActiva === seccion.id">
        
        <!-- Cabecera del Acordeón -->
        <div class="accordion-header" (click)="cambiarSeccion(seccion.id)">
          <div class="header-title">
            <i [class]="seccion.icono"></i>
            <div>
              <h3>{{ seccion.titulo }}</h3>
              <p>{{ seccion.subtitulo }}</p>
            </div>
          </div>
          <i class="fas" [ngClass]="seccionActiva === seccion.id ? 'fa-chevron-down' : 'fa-chevron-left'"></i>
        </div>

        <!-- Cuerpo del Acordeón -->
        <div class="accordion-body" *ngIf="seccionActiva === seccion.id">
          
          <!-- SECCIÓN 1: DATOS GENERALES -->
          <ng-container *ngIf="seccion.id === 'datosGenerales'" formGroupName="datosGenerales">
            
            <div class="grid-2-cols mb-3">
              <app-drag-drop-upload formControlName="banner" label="Arrastra tu imagen aquí (Banner)" hint="PNG, JPG hasta 5MB - Tamaño recomendado: 1200x240px"></app-drag-drop-upload>
              <app-drag-drop-upload formControlName="thumbnail" label="Arrastra tu imagen aquí (Thumbnail)" hint="PNG, JPG hasta 5MB - Tamaño recomendado: 1200x720px"></app-drag-drop-upload>
            </div>

            <div class="grid-2-cols mb-3">
              <div class="form-group">
                <label>Nombre del Evento *</label>
                <input type="text" formControlName="nombreEvento" class="form-control" placeholder="Ej. Gran Maratón">
              </div>
              <div class="form-group">
                <label>Grupo Organizador *</label>
                <input type="text" formControlName="grupoOrganizador" class="form-control">
              </div>
            </div>

            <div class="grid-4-cols mb-3">
              <div class="form-group">
                <label>Tipo del Evento *</label>
                <select formControlName="tipoEvento" class="form-control">
                  <option value="">Seleccione tipo</option>
                  <option *ngFor="let tipo of catalogos.tiposEvento" [value]="tipo">{{ tipo }}</option>
                </select>
              </div>
              <div class="form-group">
                <label>Cupo</label>
                <input type="number" formControlName="cupo" class="form-control">
              </div>
              <div class="form-group">
                <label>Fecha *</label>
                <input type="date" formControlName="fecha" class="form-control">
              </div>
              <div class="form-group">
                <label>Hora de Arranque *</label>
                <input type="time" formControlName="horaArranque" class="form-control">
              </div>
            </div>

            <div class="grid-2-cols mb-3">
              <div class="form-group">
                <label>Lugar *</label>
                <textarea formControlName="lugar" class="form-control" rows="3"></textarea>
              </div>
              <div class="form-group">
                <label>Ubicación de la ZT</label>
                <textarea formControlName="ubicacionZt" class="form-control" rows="3"></textarea>
              </div>
            </div>

            <!-- Nuevo Bloque: Modalidades, Categorías, y Archivos -->
            <div class="grid-2-cols align-top mb-3">
              
              <!-- Columna Izquierda -->
              <div class="left-column">
                <div class="form-group mb-3">
                  <label>Modalidades</label>
                  <textarea formControlName="modalidades" class="form-control" rows="3" placeholder="Long Input |"></textarea>
                </div>

                <div class="form-group">
                  <label>Categorías y Distancias</label>
                  <div formArrayName="categoriasDistancias" class="nested-arrays-container">
                    
                    <!-- Iteración de SPLITS -->
                    <div *ngFor="let split of splits.controls; let i = index" [formGroupName]="i" class="split-card">
                      <div class="split-header">
                        <span class="badge-split">SPLIT</span>
                        <input type="text" formControlName="nombre" class="form-control dark-input" placeholder="Input |">
                        <button type="button" class="btn-close-red" (click)="removeSplit(i)"><i class="fas fa-times"></i></button>
                      </div>
                      
                      <div class="split-body" formArrayName="ramas">
                        <!-- Iteración de RAMAS -->
                        <div *ngFor="let rama of getRamas(i).controls; let j = index" [formGroupName]="j" class="rama-card">
                          <div class="rama-header">
                            <span class="badge-rama">RAMA</span>
                            <input type="text" formControlName="nombre" class="form-control" placeholder="Input |">
                            <button type="button" class="btn-close-red" (click)="removeRama(i, j)"><i class="fas fa-times"></i></button>
                          </div>
                          
                          <div class="rama-body" formArrayName="categorias">
                            <!-- Iteración de CATEGORÍAS -->
                            <div *ngFor="let cat of getCategorias(i, j).controls; let k = index" [formGroupName]="k" class="categoria-card">
                              <span class="badge-cat">CATEGORÍA</span>
                              <input type="text" formControlName="nombre" class="form-control" placeholder="Input |">
                              <button type="button" class="btn-close-red" (click)="removeCategoria(i, j, k)"><i class="fas fa-times"></i></button>
                            </div>
                            <button type="button" class="btn-add btn-sm" (click)="addCategoria(i, j)">+ Agregar Categoría</button>
                          </div>
                        </div>
                        <button type="button" class="btn-add mb-2" (click)="addRama(i)">+ Agregar Rama</button>
                      </div>
                    </div>
                    
                    <button type="button" class="btn-add btn-lg" (click)="addSplit()">+ Agregar Split</button>
                  </div>
                </div>
              </div>

              <!-- Columna Derecha -->
              <div class="right-column">
                <div class="form-group mb-4">
                  <label>Distancias</label>
                  <app-drag-drop-upload formControlName="distanciasFile" label="Arrastra tu archivo aquí" hint="PNG, JPG, JPEG, DOC, DOCX, PDF hasta 5MB"></app-drag-drop-upload>
                </div>
                <div class="form-group mb-4">
                  <label>Rutas</label>
                  <app-drag-drop-upload formControlName="rutasFile" label="Arrastra tu archivo aquí" hint="PNG, JPG, JPEG, DOC, DOCX, PDF hasta 5MB"></app-drag-drop-upload>
                </div>
              </div>

            </div>

            <div class="section-actions">
              <button type="button" class="btn btn-outline">Limpiar</button>
              <button type="button" class="btn btn-primary" (click)="cambiarSeccion('informacionAtletas')">Siguiente ➔</button>
            </div>

          </ng-container>

          <!-- EL RESTO DE LAS SECCIONES SE AGREGARÁN AQUÍ DESPUÉS -->
          <ng-container *ngIf="seccion.id !== 'datosGenerales'">
            <p style="padding: 20px; color: #64748b;">(Campos de {{seccion.titulo}} en construcción)</p>
          </ng-container>

        </div>
      </div>

      <div class="form-submit-area" *ngIf="seccionActiva === 'informacionAdicional'">
        <button type="submit" class="btn btn-success btn-lg">💾 Crear Evento</button>
      </div>

    </form>
  </main>
</div>
